
name: Build Creative Colony Assist

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download source ZIP
        run: |
          mkdir -p project
          curl -fL "https://github.com/vitubas11-alt/Creative-Colony-Assist.-/releases/download/v0.2.16/creativecolonyassist-0.2.8.zip" -o source.zip
          unzip -q source.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod and save log
        run: |
          cd project
          gradle build --no-daemon --stacktrace --info 2>&1 | tee ../build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: warn

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-colony-assist-build
          path: project/build/libs/*.jar
          if-no-files-found: warn
